<style>
html,body{margin:0;background:#050506;font-family:Arial,Helvetica,sans-serif;color:white;overscroll-behavior:none}.page{display:flex;justify-content:center;min-height:100vh;padding:8px}.stage{position:relative;width:min(calc(100vw - 16px),1536px);aspect-ratio:1536/1024;background:url('assets/mockup.png') center/100% 100% no-repeat;box-shadow:0 0 40px #000}.overlay{position:absolute;z-index:3}input,select,textarea,button{font-family:Arial,Helvetica,sans-serif}.light{background:rgba(246,246,248,.98);border:0;color:#111;border-radius:.45vw;font-weight:800;outline:none}.dark{background:rgba(13,13,16,.98);border:0;color:white;border-radius:.45vw;outline:none}

#status{left:62.9%;top:21.8%;width:33%;height:6.6%;font-size:2.1vw;font-weight:900;padding:0 1.3%;color:#39c44a}#notes{left:62.6%;top:75.5%;width:34.1%;height:13.8%;font-size:1.3vw;padding:1%;resize:none;background:rgba(26,26,30,.98);border:0;color:white}#save{left:2.7%;top:81.3%;width:55.2%;height:7%;background:linear-gradient(90deg,#4d127a,#7226aa);border:0;color:white;font-size:2vw;font-weight:900;border-radius:.65vw}#scan{left:80%;top:5.6%;width:17%;height:7.5%;background:rgba(8,8,10,.96);border:.15vw solid #6d2aa8;color:white;font-size:1.6vw;font-weight:900;border-radius:.6vw}.click{cursor:pointer}
#syncBadge{position:absolute;z-index:4;right:2%;top:14%;font-size:.85vw;background:#151519cc;border:1px solid #444;border-radius:99px;padding:.5% .8%;color:#8df59a}.modal{position:fixed;inset:0;background:#000;z-index:99;display:none;flex-direction:column}.modal.open{display:flex}.scanTop{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;background:#050506}.scanTitle{font-size:22px;font-weight:900}.close{background:#222;border:1px solid #555;color:white;border-radius:10px;padding:12px 16px;font-weight:800}.cameraWrap{position:relative;flex:1;overflow:hidden;background:#000}.cameraWrap video{width:100%;height:100%;object-fit:cover}.target{position:absolute;left:8%;right:8%;top:36%;height:25%;border:3px solid #9b4be0;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.28);overflow:hidden}.scanLine{position:absolute;left:4%;right:4%;height:3px;top:50%;background:#d9a7ff;box-shadow:0 0 12px #a53cf0;animation:sweep 1.4s ease-in-out infinite alternate}@keyframes sweep{from{transform:translateY(-60px)}to{transform:translateY(60px)}}.scanHint{position:absolute;left:0;right:0;bottom:7%;text-align:center;font-size:18px;font-weight:800;text-shadow:0 2px 4px #000}.scanStatus{position:absolute;left:4%;right:4%;bottom:22%;z-index:15;text-align:center;font-size:13px;font-weight:800;color:#fff;background:rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:7px 8px;text-shadow:0 2px 4px #000}.resultFlash{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(57,196,74,.28);font-size:34px;font-weight:900}.ocrBadge{position:absolute;left:4%;top:2.5%;background:rgba(0,0,0,.68);border:1px solid rgba(255,255,255,.24);border-radius:8px;padding:7px 9px;font-size:12px;font-weight:900}.confirmCard{position:absolute;z-index:10;left:6%;right:6%;top:24%;display:none;background:#0d0d10;border:2px solid #9b4be0;border-radius:16px;padding:18px;box-shadow:0 12px 40px #000}.confirmCard.show{display:block}.confirmTitle{font-size:16px;font-weight:900;margin-bottom:8px}.confirmText{font-size:13px;color:#bbb;margin-bottom:12px}.confirmInput{box-sizing:border-box;width:100%;font-size:32px;font-weight:900;letter-spacing:.08em;padding:12px;border-radius:10px;border:0;background:#f4f4f6;color:#111}.confirmBtns{display:flex;gap:10px;margin-top:12px}.confirmBtns button{flex:1;padding:13px 10px;border-radius:10px;border:0;font-weight:900;font-size:15px}.confirmUse{background:#7628b3;color:white}.confirmAgain{background:#2a2a2f;color:white;border:1px solid #555!important}.manualBar{display:flex;gap:10px;padding:12px 18px calc(env(safe-area-inset-bottom) + 14px);background:#09090b}.manualBar input{flex:1;font-size:22px;padding:14px;border-radius:10px;border:1px solid #555}.manualBar button{font-size:18px;padding:14px 18px;background:#6d2aa8;border:0;color:#fff;border-radius:10px;font-weight:900}.toast{position:fixed;right:18px;bottom:18px;background:#141418;color:#fff;border:1px solid #555;padding:12px 16px;border-radius:8px;font-weight:700;display:none;z-index:120}

.frozenPreview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;z-index:1}.frozenPreview.show{display:block}.captureBar{position:absolute;z-index:12;left:6%;right:6%;bottom:8%;display:flex;gap:10px}.captureBtn{flex:1;padding:16px 14px;border:0;border-radius:12px;background:#7628b3;color:#fff;font-size:18px;font-weight:900;box-shadow:0 8px 24px #0008}.captureBtn:disabled{opacity:.5}.retakeBtn{display:none;padding:16px 14px;border-radius:12px;border:1px solid #666;background:#242429;color:#fff;font-size:16px;font-weight:900}.retakeBtn.show{display:block}.captureHelp{position:absolute;z-index:11;left:5%;right:5%;bottom:17%;text-align:center;font-size:15px;font-weight:800;text-shadow:0 2px 5px #000}.scanLine.paused{display:none}
@media(max-width:900px){#barcode{font-size:5.5vw}#newDate,#recentDate,#compound,#corner,#status,#notes,#scan{font-size:2.5vw}#coldPsi,#coldCirc,#hotPsi,#hotCirc,#lapsVal,#lapTotal,#heatCycles,#psiChange,#circChange{font-size:3.6vw}#save{font-size:3vw}#syncBadge{font-size:1.8vw}}

<body>
<div class="page"><div class="stage">
<button id="scan" class="overlay click">▣ &nbsp; SCAN BARCODE</button><div id="syncBadge">● OFFLINE READY</div>
<input id="barcode" class="overlay light" value=""><input id="newDate" class="overlay light" readonly><input id="recentDate" class="overlay light" readonly>
<select id="compound" class="overlay light"><option>M20</option><option selected>M30</option><option>M450</option></select><select id="corner" class="overlay light"><option>LF</option><option>LR</option><option>RF</option><option>RR</option></select>
<div id="lapsVal" class="overlay">0</div><button id="minus" class="overlay light click">−</button><button id="plus" class="overlay light click">+</button><div id="lapTotal" class="overlay">0</div><div id="heatCycles" class="overlay">0</div>
<input id="coldPsi" class="overlay light" inputmode="numeric"><input id="coldCirc" class="overlay light" placeholder="85 7/16"><input id="hotPsi" class="overlay light" inputmode="numeric"><input id="hotCirc" class="overlay light" placeholder="86 1/16"><div id="psiChange" class="overlay"></div><div id="circChange" class="overlay"></div>
<select id="status" class="overlay dark"><option>ACTIVE</option><option>INACTIVE</option><option>OUT OF INVENTORY</option></select><textarea id="notes" class="overlay" placeholder="Add notes about this tire..."></textarea><button id="save" class="overlay click">▣ &nbsp; SAVE TIRE RECORD</button>
</div></div>
<div id="scanner" class="modal"><div class="scanTop"><div class="scanTitle">HOOSIER BARCODE SCANNER</div><button id="closeScan" class="close">CANCEL</button></div><div class="cameraWrap"><video id="video" muted playsinline></video><img id="frozenPreview" class="frozenPreview" alt="Captured tire label"><div id="target" class="target"><div id="scanLine" class="scanLine"></div></div><div id="ocrBadge" class="ocrBadge">V8 • OCR FIRST</div><div id="scanHint" class="scanHint">Center the barcode and printed number inside the purple box</div><div id="captureHelp" class="captureHelp">Hold steady, then tap CAPTURE &amp; READ</div><div id="scanStatus" class="scanStatus">CAMERA READY</div><canvas id="scanCanvas" hidden></canvas><div id="captureBar" class="captureBar"><button id="retakeBtn" class="retakeBtn">RETAKE</button><button id="captureBtn" class="captureBtn">📸 CAPTURE &amp; READ</button></div><div id="confirmCard" class="confirmCard"><div class="confirmTitle">NUMBER FOUND</div><div id="confirmText" class="confirmText">Number read from the captured tire label. Check it before using.</div><input id="confirmInput" class="confirmInput" inputmode="numeric"><div class="confirmBtns"><button id="confirmAgain" class="confirmAgain">RETAKE</button><button id="confirmUse" class="confirmUse">USE NUMBER</button></div></div><div id="flash" class="resultFlash"></div></div><div class="manualBar"><input id="manualCode" inputmode="numeric" placeholder="Manual barcode entry"><button id="manualUse">USE</button></div></div>
<div id="toast" class="toast"></div>
<script>
const $=id=>document.getElementById(id);const today=()=>new Date().toLocaleDateString('en-US',{year:'numeric',month:'2-digit',day:'2-digit'});let laps=0,lapTotal=0,heatCycles=0,scanControls=null,lastCandidate='',sameCount=0;
function parseFrac(s){s=String(s).trim();if(!s)return NaN;const p=s.split(/\s+/);if(p.length===1&&p[0].includes('/')){const[a,b]=p[0].split('/').map(Number);return a/b}let w=parseFloat(p[0]),f=0;if(p[1]&&p[1].includes('/')){const[a,b]=p[1].split('/').map(Number);f=a/b}return w+f}
function to16(x){let sign=x<0?-1:1;x=Math.abs(x);let w=Math.floor(x+1e-9),n=Math.round((x-w)*16);if(n===16){w++;n=0}if(n===0)return(sign<0?'-':'')+w;const gcd=(a,b)=>b?gcd(b,a%b):a,d=gcd(n,16);return(sign<0?'-':'')+(w?w+' ':'')+(n/d)+'/'+(16/d)}
function updateDelta(){const p=Number($('hotPsi').value)-Number($('coldPsi').value),c=parseFrac($('hotCirc').value)-parseFrac($('coldCirc').value);const paint=(e,v,t)=>{e.textContent=t;e.style.color=v>0?'#39c44a':v<0?'#ff4d4d':'#111'};paint($('psiChange'),p,(p>0?'+':'')+(Number.isFinite(p)?Math.round(p):'—'));paint($('circChange'),c,(c>0?'+':'')+(Number.isFinite(c)?to16(c):'—'))}
['coldPsi','hotPsi','coldCirc','hotCirc'].forEach(id=>$(id).addEventListener('input',updateDelta));$('plus').onclick=()=>{laps++;$('lapsVal').textContent=laps};$('minus').onclick=()=>{laps=Math.max(0,laps-1);$('lapsVal').textContent=laps};
function key(code=$('barcode').value){return'chassispro:'+code}function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
function loadRecord(code){$('barcode').value=code;const raw=localStorage.getItem(key(code));if(raw){const r=JSON.parse(raw);$('newDate').value=r.newDate;$('recentDate').value=r.recentDate;$('compound').value=r.compound;$('corner').value=r.corner;lapTotal=r.lapTotal||0;heatCycles=r.heatCycles||0;$('lapTotal').textContent=lapTotal;$('heatCycles').textContent=heatCycles;$('status').value=r.status||'ACTIVE';$('notes').value=r.notes||'';toast('Existing tire loaded')}else{$('newDate').value=today();$('recentDate').value=today();lapTotal=0;heatCycles=0;$('lapTotal').textContent=0;$('heatCycles').textContent=0;$('notes').value='';toast('New tire created')}laps=0;$('lapsVal').textContent=0}
$('barcode').addEventListener('change',()=>{if($('barcode').value.trim())loadRecord($('barcode').value.trim())});
let cameraStream=null,reader=null,accepted=false,capturedFull=null,capturedCrop=null,analyzing=false,ocrWorker=null;
let frameCount=0,zxingHits=0,quaggaHits=0,ocrHits=0,lastFormat='';
function setScanStatus(m){$('scanStatus').textContent=m}
function cleanDigits(text){return String(text||'').replace(/\D/g,'')}
function candidateText(result){return (result&&result.getText?result.getText():String((result&&result.text)||'')).trim()}
function updateDebug(extra=''){
  const engines=(window.ZXingBrowser?'ZXING✓':'ZXING×')+'  '+(window.Quagga?'QUAGGA✓':'QUAGGA×')+'  '+(window.Tesseract?'OCR✓':'OCR×');
  setScanStatus(`${engines}${extra?'  '+extra:''}`)
}
async function tuneCamera(){
  try{
    const track=cameraStream&&cameraStream.getVideoTracks()[0]; if(!track)return;
    const caps=track.getCapabilities?track.getCapabilities():{}; const advanced={};
    if(caps.focusMode&&caps.focusMode.includes('continuous'))advanced.focusMode='continuous';
    if(caps.exposureMode&&caps.exposureMode.includes('continuous'))advanced.exposureMode='continuous';
    if(caps.zoom){const min=Number(caps.zoom.min||1),max=Number(caps.zoom.max||1);advanced.zoom=Math.min(max,Math.max(min,1.25));}
    if(Object.keys(advanced).length)await track.applyConstraints({advanced:[advanced]});
  }catch(e){console.log('camera tuning unavailable',e)}
}
function enhanceCanvas(source,contrast=1.8,threshold=null,scale=1){
  const out=document.createElement('canvas');out.width=Math.max(1,Math.round(source.width*scale));out.height=Math.max(1,Math.round(source.height*scale));
  const ctx=out.getContext('2d',{willReadFrequently:true});ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(source,0,0,out.width,out.height);
  const img=ctx.getImageData(0,0,out.width,out.height),d=img.data;
  for(let i=0;i<d.length;i+=4){const y=.299*d[i]+.587*d[i+1]+.114*d[i+2];let v=(y-128)*contrast+128;if(threshold!==null)v=v<threshold?0:255;v=Math.max(0,Math.min(255,v));d[i]=d[i+1]=d[i+2]=v}
  ctx.putImageData(img,0,0);return out
}
function captureFullFrame(){
  const v=$('video'); if(!v.videoWidth||!v.videoHeight)return null;
  const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(v,0,0,c.width,c.height);return c
}
function cropTargetFromFull(full){
  const v=$('video'),t=$('target');const vr=v.getBoundingClientRect(),tr=t.getBoundingClientRect();
  const vw=full.width,vh=full.height,scale=Math.max(vr.width/vw,vr.height/vh);const dw=vw*scale,dh=vh*scale;const ox=(vr.width-dw)/2,oy=(vr.height-dh)/2;
  let sx=(tr.left-vr.left-ox)/scale,sy=(tr.top-vr.top-oy)/scale,sw=tr.width/scale,sh=tr.height/scale;
  sx=Math.max(0,sx);sy=Math.max(0,sy);sw=Math.min(vw-sx,sw);sh=Math.min(vh-sy,sh);
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(sw));c.height=Math.max(1,Math.round(sh));c.getContext('2d',{willReadFrequently:true}).drawImage(full,sx,sy,sw,sh,0,0,c.width,c.height);return c
}
function cropBand(source,yFrac,hFrac,padFrac=0){
  const sy=Math.max(0,Math.round(source.height*yFrac)),sh=Math.min(source.height-sy,Math.round(source.height*hFrac));
  const px=Math.round(source.width*padFrac),c=document.createElement('canvas');c.width=Math.max(1,source.width-2*px);c.height=Math.max(1,sh);c.getContext('2d',{willReadFrequently:true}).drawImage(source,px,sy,c.width,sh,0,0,c.width,c.height);return c
}
function freezePreview(full){$('frozenPreview').src=full.toDataURL('image/jpeg',.94);$('frozenPreview').classList.add('show');$('scanLine').classList.add('paused');$('captureHelp').textContent='Captured image — analyzing the label';$('retakeBtn').classList.add('show')}
function unfreezePreview(){$('frozenPreview').classList.remove('show');$('frozenPreview').removeAttribute('src');$('scanLine').classList.remove('paused');$('captureHelp').textContent='Hold steady, then tap CAPTURE & READ';$('retakeBtn').classList.remove('show');$('confirmCard').classList.remove('show');$('captureBtn').disabled=false;analyzing=false;accepted=false;capturedFull=null;capturedCrop=null;updateDebug('READY')}
async function zxingRead(canvas){
  if(!window.ZXingBrowser)return null;try{if(!reader)reader=new ZXingBrowser.BrowserMultiFormatReader();const r=await reader.decodeFromCanvas(canvas);const raw=candidateText(r),digits=cleanDigits(raw);if(/^\d{6,12}$/.test(digits)){zxingHits++;return {code:digits,source:'BARCODE / ZXING'}}}catch(e){}return null
}
function quaggaRead(canvas){return withTimeout(new Promise(resolve=>{if(!window.Quagga){resolve(null);return}try{Quagga.decodeSingle({src:canvas.toDataURL('image/jpeg',.94),locate:true,numOfWorkers:0,inputStream:{size:1200,singleChannel:false},locator:{halfSample:true,patchSize:'medium'},decoder:{readers:['code_128_reader','code_39_reader','code_93_reader','i2of5_reader','ean_reader','ean_8_reader','upc_reader','upc_e_reader'],multiple:false}},r=>{const raw=r&&r.codeResult&&r.codeResult.code,digits=cleanDigits(raw);if(/^\d{6,12}$/.test(digits)){quaggaHits++;resolve({code:digits,source:'BARCODE / QUAGGA'})}else resolve(null)})}catch(e){resolve(null)}}),2500,'barcode fallback').catch(()=>null)}
function normalizeOcrText(text){
  let t=String(text||'').toUpperCase().replace(/[OQD]/g,'0').replace(/[IL|]/g,'1').replace(/S/g,'5').replace(/B/g,'8');
  const groups=t.match(/\d{6,12}/g)||[];return groups.sort((a,b)=>Math.abs(a.length-8)-Math.abs(b.length-8)||b.length-a.length)[0]||''
}
function withTimeout(promise,ms,label){
  return Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error(label+' timed out')),ms))]);
}
async function getOcrWorker(){
  if(ocrWorker)return ocrWorker;
  if(!window.Tesseract)throw new Error('OCR library did not load');
  setScanStatus('STAGE 3/4 — STARTING OCR ENGINE…');
  $('captureHelp').textContent='OCR engine is starting — first scan can take a few seconds';
  ocrWorker=await withTimeout(Tesseract.createWorker('eng',1,{logger:m=>{
    if(m&&m.status){const pct=Number.isFinite(m.progress)?` ${Math.round(m.progress*100)}%`:'';setScanStatus(`STAGE 3/4 — ${String(m.status).toUpperCase()}${pct}`)}
  }}),25000,'OCR startup');
  await ocrWorker.setParameters({tessedit_char_whitelist:'0123456789',tessedit_pageseg_mode:'7',preserve_interword_spaces:'0'});
  return ocrWorker;
}
async function ocrRead(canvas,label,step,total){
  setScanStatus(`STAGE 3/4 — OCR ${step}/${total}: ${label.toUpperCase()}`);
  $('captureHelp').textContent=`Reading captured label — pass ${step} of ${total}`;
  try{
    const worker=await getOcrWorker();
    const r=await withTimeout(worker.recognize(canvas),12000,'OCR read');
    const text=r&&r.data&&r.data.text||'',confidence=r&&r.data&&r.data.confidence||0,code=normalizeOcrText(text);
    if(/^\d{6,12}$/.test(code)){ocrHits++;setScanStatus(`STAGE 3/4 — OCR SAW ${code}`);return {code,confidence,label}}
    return null;
  }catch(e){
    console.error('OCR failure',e);setScanStatus(`OCR ERROR — ${e.message||e}`);throw e;
  }
}
function chooseConsensus(results){
  const valid=results.filter(Boolean);if(!valid.length)return null;
  const exact=new Map();for(const r of valid){const k=r.code;exact.set(k,(exact.get(k)||0)+1)}
  const exactWinner=[...exact.entries()].sort((a,b)=>b[1]-a[1])[0];if(exactWinner&&exactWinner[1]>=2){const same=valid.filter(r=>r.code===exactWinner[0]);return {code:exactWinner[0],agreement:exactWinner[1],confidence:Math.max(...same.map(x=>x.confidence||0)),source:'OCR consensus'}}
  const eight=valid.filter(r=>r.code.length===8);if(eight.length>=2){let out='';for(let i=0;i<8;i++){const counts={};for(const r of eight){const d=r.code[i];counts[d]=(counts[d]||0)+1}out+=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0]}return {code:out,agreement:1,confidence:Math.max(...eight.map(x=>x.confidence||0)),source:'OCR digit vote'}}
  valid.sort((a,b)=>(b.confidence||0)-(a.confidence||0));return {code:valid[0].code,agreement:1,confidence:valid[0].confidence||0,source:'OCR best read'}
}

      ['B/W 125',enhanceCanvas(lower,1.4,125,2.0)],
